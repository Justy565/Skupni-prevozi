{% extends "_layout.html" %}

{% block title %}Dodaj vožnjo{% endblock %}

{% block content %}
<section class="page-section">
    <div class="form-card wide-form">
        <h2>Dodaj vožnjo</h2>
        <p class="page-text">Izpolni podatke in shrani vožnjo.</p>

        <form id="voznjaForm">
            <div class="two-columns">
                <div>
                    <label>Začetek</label>
                    <input type="text" name="zacetek" required>
                </div>

                <div>
                    <label>Destinacija</label>
                    <input type="text" name="destinacija" required>
                </div>

                <div>
                    <label>Datum</label>
                    <input type="date" name="datum" id="datum" required>
                </div>

                <div>
                    <label>Čas</label>
                    <input type="time" name="cas" required>
                </div>

                <div>
                    <label>Cena</label>
                    <input type="number" name="cena" required>
                </div>

                <div>
                    <label>Sedeži</label>
                    <input type="number" name="sedezi" required>
                </div>
            </div>

            <label>Telefonska številka</label>
            <input type="text" name="telefonska" required>

            <button type="submit">Dodaj vožnjo</button>
            <p id="status" class="page-text"></p>
        </form>
    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const danes = new Date().toISOString().split("T")[0];
    document.getElementById("datum").setAttribute("min", danes);
});

document.getElementById("voznjaForm").onsubmit = async function(e) {
    e.preventDefault();

    const podatki = Object.fromEntries(new FormData(e.target));

    const res = await fetch("/dodaj_voznjo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(podatki)
    });

    const json = await res.json();

    if (json.success) {
        window.location.href = "/moje_voznje";
    } else {
        document.getElementById("status").innerText = json.error;
    }
}
</script>
{% endblock %}

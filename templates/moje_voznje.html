{% extends "_layout.html" %}

{% block title %}Moje vožnje{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container">
        <div class="dashboard-card">
            <h2>Moje vožnje</h2>
            <p class="page-text">Tukaj vidiš svoje vožnje.</p>
            <div id="voznje-container">Nalaganje...</div>
        </div>
    </div>
</section>

<script>
function esc(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

async function naloziVoznje() {
    const res = await fetch("/api/moje_voznje");
    const data = await res.json();

    const container = document.getElementById("voznje-container");
    container.innerHTML = "";

    if (data.success && data.voznje.length > 0) {
        data.voznje.forEach(v => {
            container.innerHTML += `
                <div class="ride-card">
                    <h3>${esc(v.zacetek)} - ${esc(v.destinacija)}</h3>
                    <p>Datum: ${esc(v.datum)} ob ${esc(v.cas)}</p>
                    <p>Cena: ${esc(v.cena)} €</p>
                    <p>Sedeži: ${esc(v.sedezi)}</p>
                    <p>Telefon: ${esc(v.telefonska)}</p>
                    <button onclick="izbrisi(${v.doc_id})" class="delete-btn">Izbriši</button>
                </div>
            `;
        });
    } else {
        container.innerHTML = "<p>Trenutno nimaš vnešenih voženj.</p>";
    }
}

async function izbrisi(id) {
    if (!confirm("Ali res želiš izbrisati vožnjo?")) return;

    const res = await fetch("/izbrisi_voznjo/" + id, {
        method: "POST"
    });

    const data = await res.json();

    if (data.success) {
        naloziVoznje();
    } else {
        alert(data.error);
    }
}

naloziVoznje();
</script>
{% endblock %}
